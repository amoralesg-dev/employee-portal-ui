name: CI CD EMPLOYEE-PORTAL-UI PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-ui-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build Employee Portal UI PROD
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Compilar Angular PROD
        run: npm run build:prod

      - name: Validar build generado
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PATH="dist/employee-portal-ui/browser"

          test -d "$BUILD_PATH"
          test -f "$BUILD_PATH/index.html"
          compgen -G "$BUILD_PATH/main*.js" > /dev/null
          compgen -G "$BUILD_PATH/styles*.css" > /dev/null
          test -d "$BUILD_PATH/assets"

          node - <<'NODE'
          const fs = require('fs');

          const indexPath =
            'dist/employee-portal-ui/browser/index.html';

          const html =
            fs.readFileSync(indexPath, 'utf8');

          if (!html.includes('/employee-portal/')) {
            console.error(
              'index.html no contiene /employee-portal/'
            );
            process.exit(1);
          }

          console.log(
            'Base href validado correctamente.'
          );
          NODE

      - name: Validar configuracion PROD compilada
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PATH="dist/employee-portal-ui/browser"
          EXPECTED_URL="/employee-portal/api/v1"

          INVALID_PATTERNS=(
            "REPLACE_WITH_PROD_HOST"
            "http://10.15.1.15:8083"
            "http://localhost:8083/employee-portal"
            "http://localhost:8082/ms-pagos"
            "http://127.0.0.1:8083/employee-portal"
            "http://10.15.1.15:8082/ms-pagos"
          )

          for PATTERN in "${INVALID_PATTERNS[@]}"; do
            if grep -RIFq \
              --include="*.js" \
              "$PATTERN" \
              "$BUILD_PATH"; then
              echo "URL incorrecta encontrada:"
              echo "$PATTERN"
              exit 1
            fi
          done

          if ! grep -RIFq \
            --include="*.js" \
            "$EXPECTED_URL" \
            "$BUILD_PATH"; then
            echo "No se encontro la URL PROD esperada:"
            echo "$EXPECTED_URL"
            exit 1
          fi

          echo "Configuracion PROD validada:"
          echo "$EXPECTED_URL"

      - name: Subir build Angular
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-ui-build
          path: dist/employee-portal-ui/browser
          if-no-files-found: error
          retention-days: 7

  deploy-prod:
    name: Deploy Employee Portal UI PROD
    needs: build

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on:
      - self-hosted
      - employee-portal-ui
      - prod

    steps:
      - name: Preparar carpeta temporal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $deployPath =
            'C:\deploy\employee-portal-ui'

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $deployPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force

          Write-Host `
            "Carpeta temporal preparada: $deployPath"

      - name: Descargar build Angular
        uses: actions/download-artifact@v4
        with:
          name: employee-portal-ui-build
          path: C:\deploy\employee-portal-ui

      - name: Validar artifact descargado
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $deployPath =
            'C:\deploy\employee-portal-ui'

          $requiredItems = @(
            'index.html',
            'assets'
          )

          foreach ($item in $requiredItems) {
            $itemPath =
              Join-Path $deployPath $item

            if (-not (Test-Path $itemPath)) {
              throw "No existe en el artifact: $itemPath"
            }
          }

          $mainFiles = Get-ChildItem -Path $deployPath -Filter 'main*.js' -ErrorAction SilentlyContinue
          if (-not $mainFiles) {
            throw "No existe archivo main*.js en el artifact: $deployPath"
          }

          $styleFiles = Get-ChildItem -Path $deployPath -Filter 'styles*.css' -ErrorAction SilentlyContinue
          if (-not $styleFiles) {
            throw "No existe archivo styles*.css en el artifact: $deployPath"
          }

          $indexPath =
            Join-Path $deployPath 'index.html'

          $html =
            Get-Content `
              -Path $indexPath `
              -Raw

          if (-not $html.Contains('/employee-portal/')) {
            throw `
              'El artifact no contiene /employee-portal/ en index.html.'
          }

          Write-Host `
            'Artifact descargado y validado correctamente.'

      - name: Crear carpetas de despliegue
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          New-Item `
            -ItemType Directory `
            -Path $currentPath `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $backupPath `
            -Force |
            Out-Null

          Write-Host `
            'Carpetas de despliegue preparadas.'

      - name: Respaldar version actual
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          $backupFile =
            Join-Path `
              $backupPath `
              "employee-portal-ui-$env:GITHUB_RUN_NUMBER.zip"

          $currentIndex =
            Join-Path `
              $currentPath `
              'index.html'

          if (Test-Path $currentIndex) {
            Compress-Archive `
              -Path "$currentPath\*" `
              -DestinationPath $backupFile `
              -Force

            Write-Host `
              "Backup generado: $backupFile"
          }
          else {
            Write-Host `
              'Primer despliegue sin version anterior.'
          }

      - name: Conservar ultimos 6 backups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-ui-*.zip' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 6 |
            Remove-Item -Force

          Write-Host 'Backups conservados:'

          Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-ui-*.zip' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object `
              Name,
              Length,
              LastWriteTime

      - name: Publicar nuevo build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath =
            'C:\deploy\employee-portal-ui'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          Get-ChildItem `
            -Path $currentPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force

          Copy-Item `
            -Path "$sourcePath\*" `
            -Destination $currentPath `
            -Recurse `
            -Force `
            -ErrorAction Stop

          $indexPath =
            Join-Path $currentPath 'index.html'

          if (-not (Test-Path $indexPath)) {
            throw `
              'No se copio index.html al destino.'
          }

          Write-Host `
            'Build publicado correctamente.'

      - name: Crear web.config para Angular IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $webConfigPath =
            'C:\apps-front\ROC_Apps\employee-portal\current\web.config'

          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <defaultDocument>
                <files>
                  <clear />
                  <add value="index.html" />
                </files>
              </defaultDocument>
              <rewrite>
                <rules>
                  <clear />
                  <rule name="ReverseProxyEmployeePortalApi" stopProcessing="true">
                    <match url="^api/(.*)" />
                    <action type="Rewrite" url="http://10.15.1.25:8083/employee-portal/api/{R:1}" logRewrittenUrl="true" />
                  </rule>
                  <rule name="ReverseProxyEmployeePortalOAuth2" stopProcessing="true">
                    <match url="^oauth2/(.*)" />
                    <action type="Rewrite" url="http://10.15.1.25:8083/employee-portal/oauth2/{R:1}" logRewrittenUrl="true" />
                  </rule>
                  <rule name="ReverseProxyEmployeePortalWellKnown" stopProcessing="true">
                    <match url="^\.well-known/(.*)" />
                    <action type="Rewrite" url="http://10.15.1.25:8083/employee-portal/.well-known/{R:1}" logRewrittenUrl="true" />
                  </rule>
                  <rule name="ReverseProxyEmployeePortalUserInfo" stopProcessing="true">
                    <match url="^userinfo$" />
                    <action type="Rewrite" url="http://10.15.1.25:8083/employee-portal/userinfo" logRewrittenUrl="true" />
                  </rule>
                  <rule name="ReverseProxyEmployeePortalConnect" stopProcessing="true">
                    <match url="^connect/(.*)" />
                    <action type="Rewrite" url="http://10.15.1.25:8083/employee-portal/connect/{R:1}" logRewrittenUrl="true" />
                  </rule>
                  <rule name="Angular Routes Employee Portal" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          '@

          Set-Content `
            -Path $webConfigPath `
            -Value $webConfig `
            -Encoding UTF8

          if (-not (Test-Path $webConfigPath)) {
            throw `
              'No se genero web.config.'
          }

          Write-Host `
            'web.config generado correctamente.'

      - name: Validar publicacion e IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $requiredItems = @(
            'index.html',
            'assets',
            'web.config'
          )

          foreach ($item in $requiredItems) {
            $itemPath =
              Join-Path $currentPath $item

            if (-not (Test-Path $itemPath)) {
              throw `
                "Falta en la publicacion: $itemPath"
            }
          }

          $mainFiles = Get-ChildItem -Path $currentPath -Filter 'main*.js' -ErrorAction SilentlyContinue
          if (-not $mainFiles) {
            throw "Falta archivo main*.js en la publicacion: $currentPath"
          }

          $styleFiles = Get-ChildItem -Path $currentPath -Filter 'styles*.css' -ErrorAction SilentlyContinue
          if (-not $styleFiles) {
            throw "Falta archivo styles*.css en la publicacion: $currentPath"
          }

          $indexPath =
            Join-Path $currentPath 'index.html'

          $html =
            Get-Content `
              -Path $indexPath `
              -Raw

          if (-not $html.Contains('/employee-portal/')) {
            throw `
              'El index.html publicado no contiene /employee-portal/.'
          }

          $webConfigPath =
            Join-Path $currentPath 'web.config'

          $rulesText =
            Get-Content `
              -Path $webConfigPath `
              -Raw

          Write-Host $rulesText

          $requiredRules = @(
            'ReverseProxyEmployeePortalApi',
            'ReverseProxyEmployeePortalOAuth2',
            'ReverseProxyEmployeePortalWellKnown',
            'ReverseProxyEmployeePortalUserInfo',
            'ReverseProxyEmployeePortalConnect',
            'Angular Routes Employee Portal'
          )

          foreach ($ruleName in $requiredRules) {
            if ($rulesText -notmatch [regex]::Escape($ruleName)) {
              throw "No se encontro la regla requerida en web.config: $ruleName"
            }
          }

          if (
            $rulesText -match
            'action type="Rewrite" url="/index.html"'
          ) {
            throw `
              'Employee Portal contiene la regla del portal legacy.'
          }

          Write-Host `
            'Publicacion y reglas IIS validadas.'

      - name: Validar Employee Portal por HTTPS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $candidateUrls = @(
            'https://rss-cxp.rassini.com/employee-portal/auth/login',
            'http://127.0.0.1:8080/employee-portal/auth/login'
          )

          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host `
              "Intento $i de $maxAttempts"

            foreach ($url in $candidateUrls) {
              try {
                $response =
                  Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 15

                $hasCorrectContext =
                  $response.Content.Contains(
                    '/employee-portal/'
                  )

                if (
                  $response.StatusCode -eq 200 -and
                  $hasCorrectContext
                ) {
                  Write-Host `
                    "Employee Portal UI PROD respondio HTTP 200 en: $url"

                  Write-Host `
                    'Contexto /employee-portal/ validado.'

                  exit 0
                }

                if ($response.StatusCode -eq 200) {
                  Write-Host `
                    "HTTP 200 en $url (el sitio responde en puerto 8080 pero la aplicacion /employee-portal aun requiere su registro en IIS)."
                }
                else {
                  Write-Host `
                    "Respuesta no valida en $url. HTTP: $($response.StatusCode)"
                }
              }
              catch {
                Write-Host `
                  "Endpoint $url no disponible: $($_.Exception.Message)"
              }
            }

            Start-Sleep -Seconds 5
          }

          throw `
            'Employee Portal UI PROD no respondio correctamente por HTTPS.'
