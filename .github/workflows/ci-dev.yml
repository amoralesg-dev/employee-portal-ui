name: CI CD EMPLOYEE-PORTAL-UI DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-ui-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build Employee Portal UI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Compilar Angular DEV
        run: npm run build:dev

      - name: Validar build generado
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PATH="dist/employee-portal-ui/browser"

          test -d "$BUILD_PATH"
          test -f "$BUILD_PATH/index.html"
          test -f "$BUILD_PATH/main.js"
          test -f "$BUILD_PATH/styles.css"
          test -d "$BUILD_PATH/assets"

          node - <<'NODE'
          const fs = require('fs');

          const indexPath =
            'dist/employee-portal-ui/browser/index.html';

          const html =
            fs.readFileSync(indexPath, 'utf8');

          if (!html.includes('/employee-portal/')) {
            console.error(
              'index.html no contiene /employee-portal/'
            );
            process.exit(1);
          }

          console.log(
            'Base href validado correctamente.'
          );
          NODE

      - name: Validar configuracion DEV compilada
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PATH="dist/employee-portal-ui/browser"
          EXPECTED_URL="http://10.15.1.15:8083/employee-portal/api/v1"

          INVALID_PATTERNS=(
            "http://localhost:8083/employee-portal"
            "http://localhost:8082/ms-pagos"
            "http://127.0.0.1:8083/employee-portal"
            "http://10.15.1.15:8082/ms-pagos"
          )

          for PATTERN in "${INVALID_PATTERNS[@]}"; do
            if grep -RIFq \
              --include="*.js" \
              "$PATTERN" \
              "$BUILD_PATH"; then
              echo "URL incorrecta encontrada:"
              echo "$PATTERN"
              exit 1
            fi
          done

          if ! grep -RIFq \
            --include="*.js" \
            "$EXPECTED_URL" \
            "$BUILD_PATH"; then
            echo "No se encontro la URL DEV esperada:"
            echo "$EXPECTED_URL"
            exit 1
          fi

          echo "Configuracion DEV validada:"
          echo "$EXPECTED_URL"

      - name: Subir build Angular
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-ui-build
          path: dist/employee-portal-ui/browser
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy Employee Portal UI DEV
    needs: build

    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on:
      - self-hosted
      - employee-portal-ui
      - dev

    steps:
      - name: Preparar carpeta temporal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $deployPath =
            'C:\deploy\employee-portal-ui'

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $deployPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force

          Write-Host `
            "Carpeta temporal preparada: $deployPath"

      - name: Descargar build Angular
        uses: actions/download-artifact@v4
        with:
          name: employee-portal-ui-build
          path: C:\deploy\employee-portal-ui

      - name: Validar artifact descargado
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $deployPath =
            'C:\deploy\employee-portal-ui'

          $requiredItems = @(
            'index.html',
            'main.js',
            'styles.css',
            'assets'
          )

          foreach ($item in $requiredItems) {
            $itemPath =
              Join-Path $deployPath $item

            if (-not (Test-Path $itemPath)) {
              throw "No existe en el artifact: $itemPath"
            }
          }

          $indexPath =
            Join-Path $deployPath 'index.html'

          $html =
            Get-Content `
              -Path $indexPath `
              -Raw

          if (-not $html.Contains('/employee-portal/')) {
            throw `
              'El artifact no contiene /employee-portal/ en index.html.'
          }

          Write-Host `
            'Artifact descargado y validado correctamente.'

      - name: Crear carpetas de despliegue
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          New-Item `
            -ItemType Directory `
            -Path $currentPath `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $backupPath `
            -Force |
            Out-Null

          Write-Host `
            'Carpetas de despliegue preparadas.'

      - name: Respaldar version actual
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          $backupFile =
            Join-Path `
              $backupPath `
              "employee-portal-ui-$env:GITHUB_RUN_NUMBER.zip"

          $currentIndex =
            Join-Path `
              $currentPath `
              'index.html'

          if (Test-Path $currentIndex) {
            Compress-Archive `
              -Path "$currentPath\*" `
              -DestinationPath $backupFile `
              -Force

            Write-Host `
              "Backup generado: $backupFile"
          }
          else {
            Write-Host `
              'Primer despliegue sin version anterior.'
          }

      - name: Conservar ultimos 6 backups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $backupPath =
            'C:\apps-front\ROC_Apps\employee-portal\backup'

          Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-ui-*.zip' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 6 |
            Remove-Item -Force

          Write-Host 'Backups conservados:'

          Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-ui-*.zip' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object `
              Name,
              Length,
              LastWriteTime

      - name: Publicar nuevo build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath =
            'C:\deploy\employee-portal-ui'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          Get-ChildItem `
            -Path $currentPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force

          Copy-Item `
            -Path "$sourcePath\*" `
            -Destination $currentPath `
            -Recurse `
            -Force `
            -ErrorAction Stop

          $indexPath =
            Join-Path $currentPath 'index.html'

          if (-not (Test-Path $indexPath)) {
            throw `
              'No se copio index.html al destino.'
          }

          Write-Host `
            'Build publicado correctamente.'

      - name: Crear web.config para Angular IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $webConfigPath =
            'C:\apps-front\ROC_Apps\employee-portal\current\web.config'

          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <defaultDocument>
                <files>
                  <clear />
                  <add value="index.html" />
                </files>
              </defaultDocument>
              <rewrite>
                <rules>
                  <clear />
                  <rule name="Angular Routes Employee Portal" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          '@

          Set-Content `
            -Path $webConfigPath `
            -Value $webConfig `
            -Encoding UTF8

          if (-not (Test-Path $webConfigPath)) {
            throw `
              'No se genero web.config.'
          }

          Write-Host `
            'web.config generado correctamente.'

      - name: Validar publicacion e IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentPath =
            'C:\apps-front\ROC_Apps\employee-portal\current'

          $requiredItems = @(
            'index.html',
            'main.js',
            'styles.css',
            'assets',
            'web.config'
          )

          foreach ($item in $requiredItems) {
            $itemPath =
              Join-Path $currentPath $item

            if (-not (Test-Path $itemPath)) {
              throw `
                "Falta en la publicacion: $itemPath"
            }
          }

          $indexPath =
            Join-Path $currentPath 'index.html'

          $html =
            Get-Content `
              -Path $indexPath `
              -Raw

          if (-not $html.Contains('/employee-portal/')) {
            throw `
              'El index.html publicado no contiene /employee-portal/.'
          }

          $appcmd =
            "$env:windir\System32\inetsrv\appcmd.exe"

          if (-not (Test-Path $appcmd)) {
            throw `
              'No existe appcmd.exe en el servidor.'
          }

          $rules = & $appcmd `
            list config `
            'ROC_Apps/employee-portal' `
            /section:system.webServer/rewrite/rules

          $rulesText =
            $rules -join "`n"

          Write-Host $rulesText

          if (
            $rulesText -notmatch
            'Angular Routes Employee Portal'
          ) {
            throw `
              'No se encontro la regla Angular de Employee Portal.'
          }

          if (
            $rulesText -match
            'action type="Rewrite" url="/index.html"'
          ) {
            throw `
              'Employee Portal hereda la regla del portal legacy.'
          }

          Write-Host `
            'Publicacion y reglas IIS validadas.'

      - name: Validar Employee Portal por HTTPS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $url =
            'https://rss-cxp-dev.rassini.com/employee-portal/auth/login'

          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host `
              "Intento $i de $maxAttempts"

            try {
              $response =
                Invoke-WebRequest `
                  -Uri $url `
                  -UseBasicParsing `
                  -TimeoutSec 15

              $hasCorrectContext =
                $response.Content.Contains(
                  '/employee-portal/'
                )

              if (
                $response.StatusCode -eq 200 -and
                $hasCorrectContext
              ) {
                Write-Host `
                  'Employee Portal UI respondio HTTP 200.'

                Write-Host `
                  'Contexto /employee-portal/ validado.'

                exit 0
              }

              Write-Host `
                "Respuesta no valida. HTTP: $($response.StatusCode)"
            }
            catch {
              Write-Host `
                "Employee Portal UI aun no disponible: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw `
            'Employee Portal UI no respondio correctamente por HTTPS.'