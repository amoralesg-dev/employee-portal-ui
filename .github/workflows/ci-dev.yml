name: CI CD EMPLOYEE-PORTAL-UI DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-ui-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build Employee Portal UI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Compilar Angular DEV
        run: npm run build:dev

      - name: Validar archivos del build
        shell: bash
        run: |
          set -e

          BUILD_PATH="dist/employee-portal-ui/browser"

          if [ ! -d "$BUILD_PATH" ]; then
            echo "No existe la carpeta del build: $BUILD_PATH"
            exit 1
          fi

          for FILE in index.html main.js styles.css; do
            if [ ! -f "$BUILD_PATH/$FILE" ]; then
              echo "No existe $FILE en $BUILD_PATH"
              exit 1
            fi
          done

          if [ ! -d "$BUILD_PATH/assets" ]; then
            echo "No existe la carpeta assets en $BUILD_PATH"
            exit 1
          fi

          ls -la "$BUILD_PATH"

      - name: Validar base href
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath =
            'dist/employee-portal-ui/browser/index.html';

          const content =
            fs.readFileSync(indexPath, 'utf8');

          const expected =
            '<base href="/employee-portal/"/>';

          if (!content.includes(expected)) {
            console.error(
              `index.html no contiene: ${expected}`
            );
            console.error(content);
            process.exit(1);
          }

          console.log(
            'Base href validado: /employee-portal/'
          );
          NODE

      - name: Validar configuracion DEV compilada
        shell: bash
        run: |
          set -e

          BUILD_PATH="dist/employee-portal-ui/browser"
          EXPECTED_URL="http://10.15.1.15:8083/employee-portal/api/v1"

          INVALID_PATTERNS=(
            "http://localhost:8083/employee-portal"
            "http://localhost:8082/ms-pagos"
            "http://127.0.0.1:8083/employee-portal"
            "http://10.15.1.15:8082/ms-pagos"
          )

          for PATTERN in "${INVALID_PATTERNS[@]}"; do
            if grep -RIFq \
              "$PATTERN" \
              "$BUILD_PATH" \
              --include="*.js"; then
              echo "URL incorrecta encontrada:"
              echo "$PATTERN"
              exit 1
            fi
          done

          if ! grep -RIFq \
            "$EXPECTED_URL" \
            "$BUILD_PATH" \
            --include="*.js"; then
            echo "No se encontro la URL DEV esperada:"
            echo "$EXPECTED_URL"
            exit 1
          fi

          echo "Configuracion DEV validada."
          echo "Backend: $EXPECTED_URL"

      - name: Subir build Angular
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-ui-build
          path: dist/employee-portal-ui/browser
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy Employee Portal UI DEV
    needs: build

    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')

    runs-on:
      - self-hosted
      - employee-portal-ui
      - dev

    steps:
      - name: Preparar carpeta temporal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $deployPath =
            "C:\deploy\employee-portal-ui"

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $deployPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host `
            "Carpeta temporal preparada: $deployPath"

      - name: Descargar build Angular
        uses: actions/download-artifact@v4
        with:
          name: employee-portal-ui-build
          path: C:\deploy\employee-portal-ui

      - name: Validar artifact descargado
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $deployPath =
            "C:\deploy\employee-portal-ui"

          $requiredFiles = @(
            "index.html",
            "main.js",
            "styles.css"
          )

          foreach ($file in $requiredFiles) {
            $filePath =
              Join-Path $deployPath $file

            if (-not (Test-Path $filePath)) {
              throw `
                "No existe $file en el artifact."
            }
          }

          $assetsPath =
            Join-Path $deployPath "assets"

          if (-not (Test-Path $assetsPath)) {
            throw `
              "No existe la carpeta assets."
          }

          $indexPath =
            Join-Path $deployPath "index.html"

          $indexContent =
            Get-Content -Path $indexPath -Raw

          $expectedBaseHref =
            '<base href="/employee-portal/"/>'

          if (
            -not $indexContent.Contains(
              $expectedBaseHref
            )
          ) {
            throw `
              "El artifact no tiene el base href correcto."
          }

          Get-ChildItem -Path $deployPath |
            Select-Object `
              Name,
              Length,
              LastWriteTime

      - name: Crear carpetas de despliegue
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $currentPath =
            "C:\apps-front\ROC_Apps\employee-portal\current"

          $backupPath =
            "C:\apps-front\ROC_Apps\employee-portal\backup"

          New-Item `
            -ItemType Directory `
            -Path $currentPath `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $backupPath `
            -Force |
            Out-Null

          Write-Host `
            "Carpetas de despliegue preparadas."

      - name: Respaldar version actual
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $currentPath =
            "C:\apps-front\ROC_Apps\employee-portal\current"

          $backupPath =
            "C:\apps-front\ROC_Apps\employee-portal\backup"

          $backupName =
            "employee-portal-ui-$env:GITHUB_RUN_NUMBER.zip"

          $backupFile =
            Join-Path $backupPath $backupName

          $currentIndex =
            Join-Path $currentPath "index.html"

          if (Test-Path $currentIndex) {
            Compress-Archive `
              -Path "$currentPath\*" `
              -DestinationPath $backupFile `
              -Force

            Write-Host `
              "Backup generado: $backupFile"
          }
          else {
            Write-Host `
              "Primer despliegue sin backup anterior."
          }

      - name: Conservar ultimos 6 backups
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $backupPath =
            "C:\apps-front\ROC_Apps\employee-portal\backup"

          $backups = Get-ChildItem `
            -Path $backupPath `
            -Filter "employee-portal-ui-*.zip" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending

          $backups |
            Select-Object -Skip 6 |
            Remove-Item -Force

          Get-ChildItem `
            -Path $backupPath `
            -Filter "employee-portal-ui-*.zip" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object `
              Name,
              Length,
              LastWriteTime

      - name: Limpiar carpeta current
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $currentPath =
            "C:\apps-front\ROC_Apps\employee-portal\current"

          Get-ChildItem `
            -Path $currentPath `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host `
            "Carpeta current limpiada."

      - name: Copiar nuevo build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePath =
            "C:\deploy\employee-portal-ui"

          $currentPath =
            "C:\apps-front\ROC_Apps\employee-portal\current"

          Copy-Item `
            -Path "$sourcePath\*" `
            -Destination $currentPath `
            -Recurse `
            -Force `
            -ErrorAction Stop

          $indexPath =
            Join-Path $currentPath "index.html"

          if (-not (Test-Path $indexPath)) {
            throw `
              "No se copio index.html al destino."
          }

          Write-Host `
            "Build copiado correctamente."

      - name: Crear web.config para Angular IIS
        shell: powershell
        run: |
ce = "Stop"

          $webConfigPath =
            "C:\apps-front\ROC_Apps\employee-portal\current\web.config"

          $webConfigLines = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<configuration>',
            '  <system.webServer>',
            '    <defaultDocument>',
            '      <files>',
            '        <clear />',
            '        <add value="index.html" />',
            '      </files>',
            '    </defaultDocument>',
            '    <rewrite>',
            '      <rules>',
            '        <clear />',
            '        <rule name="Angular Routes Employee Portal" stopProcessing="true">',
            '          <match url=".*" />',
            '          <conditions logicalGrouping="MatchAll">',
            '            <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />',
            '            <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />',
            '          </conditions>',
            '          <action type="Rewrite" url="index.html" />',
            '        </rule>',
            '      </rules>',
            '    </rewrite>',
            '  </system.webServer>',
            '</configuration>'
          )

          Set-Content `
            -Path $webConfigPath `
            -Value $webConfigLines `
            -Encoding UTF8

          if (-not (Test-Path $webConfigPath)) {
            throw "No se genero web.config."
          }

          $content =
            Get-Content -Path $webConfigPath -Raw

          if (-not $content.Contains('<clear />')) {
            throw `
              "web.config no limpia reglas heredadas."
          }

          if (
            $content.Contains(
              'action type="Rewrite" url="/index.html"'
            )
          ) {
            throw `
              "web.config reescribe al portal raiz."
          }

          Write-Host `
            "web.config generado correctamente."

      - name: Validar archivos publicados
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $currentPath =
            "C:\apps-front\ROC_Apps\employee-portal\current"

          $requiredFiles = @(
            "index.html",
            "main.js",
            "styles.css",
            "web.config"
          )

          foreach ($file in $requiredFiles) {
            $filePath =
              Join-Path $currentPath $file

            if (-not (Test-Path $filePath)) {
              throw `
                "Falta el archivo publicado: $file"
            }
          }

          $assetsPath =
            Join-Path $currentPath "assets"

          if (-not (Test-Path $assetsPath)) {
            throw "Falta la carpeta assets."
          }

          $indexPath =
            Join-Path $currentPath "index.html"

          $indexContent =
            Get-Content -Path $indexPath -Raw

          $expectedBaseHref =
            '/employee-portal/'

          if (
            -not $indexContent.Contains(
              $expectedBaseHref
            )
          ) {
            throw `
              "index.html desplegado tiene base href incorrecto."
          }

          Get-ChildItem -Path $currentPath |
            Select-Object `
              Name,
              Length,
              LastWriteTime

      - name: Validar reglas IIS efectivas
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $appcmd =
            "$env:windir\System32\inetsrv\appcmd.exe"

          if (-not (Test-Path $appcmd)) {
            throw `
              "No existe appcmd.exe en el servidor."
          }

          $rules = & $appcmd `
            list config "ROC_Apps/employee-portal" `
            /section:system.webServer/rewrite/rules

          $rules | Write-Host

          $rulesText =
            $rules -join "`n"

          if (
            $rulesText -notmatch
            "Angular Routes Employee Portal"
          ) {
            throw `
              "No se encontro la regla Angular."
          }

          if (
            $rulesText -match
            'action type="Rewrite" url="/index.html"'
          ) {
            throw `
              "Se heredo la regla del portal legacy."
          }

          Write-Host `
            "Reglas IIS validadas correctamente."

      - name: Validar Employee Portal en IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url =
            "https://rss-cxp-dev.rassini.com/employee-portal/auth/login"

          $expectedBaseHref =
            '/employee-portal/'

          $maxAttempts = 12

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host `
              "Intento $i de $maxAttempts"

            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 15

              if ($response.StatusCode -eq 200) {
                if (
                  -not $response.Content.Contains(
                    $expectedBaseHref
                  )
                ) {
                  throw `
                    "IIS entrego un index.html incorrecto."
                }

                Write-Host `
                  "Employee Portal UI respondio HTTP 200."

                Write-Host `
                  "Base href validado en IIS."

                exit 0
              }

              Write-Host `
                "Respuesta HTTP: $($response.StatusCode)"
            }
            catch {
              Write-Host `
                "IIS aun no disponible: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw `
            "Employee Portal UI no respondio correctamente."