<app-page-header
    title="Usuarios"
    subtitle="Administración y gestión de usuarios del portal">
</app-page-header>

<app-page-toolbar>
    <button
        *ngIf="canCreate"
        pButton
        label="Nuevo Usuario"
        icon="pi pi-plus"
        (click)="showCreateDialog()">
    </button>
</app-page-toolbar>

<app-page-content>
    <div class="usuarios-container">
        <app-data-table
            [columns]="columns"
            [data]="usuarios"
            [loading]="loading"
            [rows]="10"
            [globalFilterFields]="['id', 'username', 'email', 'enabledText', 'rolesText']">
            
            <ng-template #actions let-row>
                <!-- Editar — requiere USER_UPDATE -->
                <button
                    *ngIf="canUpdate"
                    pButton
                    icon="pi pi-pencil"
                    class="p-button-text"
                    pTooltip="Editar Usuario"
                    tooltipPosition="top"
                    (click)="showEditDialog(row)">
                </button>
                
                <!-- Resetear contraseña — requiere USER_PASSWORD_RESET -->
                <button
                    *ngIf="canResetPassword"
                    pButton
                    icon="pi pi-lock"
                    severity="warn"
                    class="p-button-text"
                    pTooltip="Resetear Contraseña"
                    tooltipPosition="top"
                    (click)="resetPassword(row)">
                </button>

                <!-- Activar/Desactivar — requiere USER_DELETE -->
                <button
                    *ngIf="canDelete"
                    pButton
                    [icon]="row.enabled ? 'pi pi-ban' : 'pi pi-check'"
                    [severity]="row.enabled ? 'warn' : 'success'"
                    class="p-button-text"
                    [pTooltip]="row.enabled ? 'Desactivar Usuario' : 'Activar Usuario'"
                    tooltipPosition="top"
                    (click)="toggleStatus(row)">
                </button>
            </ng-template>
        </app-data-table>
    </div>
</app-page-content>

<app-app-dialog
    [(visible)]="dialogVisible"
    [title]="selectedUser ? 'Editar Usuario' : 'Nuevo Usuario'"
    width="800px">
    
    <app-usuario-form
        *ngIf="dialogVisible"
        [user]="selectedUser"
        (save)="guardarUsuario($event)"
        (cancel)="dialogVisible = false">
    </app-usuario-form>
</app-app-dialog>

<!-- Modal para mostrar la contraseña temporal generada -->
<app-app-dialog
    [(visible)]="tempPasswordVisible"
    title="✅ Contraseña reseteada"
    width="450px">
    
    <div class="flex flex-col gap-4 p-4">
        
        <div class="flex flex-col">
            <span class="text-color-secondary font-semibold">Usuario:</span>
            <span class="text-xl font-bold">{{ selectedUser?.username }}</span>
        </div>

        <div class="flex flex-col mt-4">
            <span class="text-color-secondary font-semibold">Contraseña temporal:</span>
            <div class="flex items-center gap-2 mt-2">
                <span class="text-2xl font-mono font-bold select-all tracking-wider text-primary">{{ generatedTempPassword }}</span>
            </div>
            <div class="mt-4">
                <button pButton label="COPIAR" icon="pi pi-copy" class="w-full sm:w-auto" (click)="copyTempPassword()"></button>
            </div>
        </div>
        
        <p class="m-0 text-sm mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
            Esta contraseña debe ser cambiada por el usuario al iniciar sesión.
        </p>
    </div>
</app-app-dialog>
