<div class="permiso-menus-container flex flex-col gap-4">

    <!-- Header info -->
    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg flex flex-col gap-2">
        <div class="flex items-center gap-2">
            <span class="font-bold text-gray-700">Permiso:</span>
            <span class="text-blue-600 font-semibold">{{ permission.code }}</span>
        </div>
        <div class="flex items-center gap-2" *ngIf="permission.description">
            <span class="font-bold text-gray-700">Descripción:</span>
            <span class="text-gray-600">{{ permission.description }}</span>
        </div>
        <div class="flex items-center gap-2" *ngIf="application">
            <span class="font-bold text-gray-700">Aplicación:</span>
            <span class="text-gray-600">{{ application.name }} ({{ application.code }})</span>
        </div>
    </div>

    <!-- PickList -->
    <p-pickList 
        [source]="availableMenus" 
        [target]="assignedMenus" 
        sourceHeader="Menús Disponibles" 
        targetHeader="Menús Asignados" 
        [dragdrop]="true" 
        [responsive]="true" 
        [sourceStyle]="{ height: '300px' }" 
        [targetStyle]="{ height: '300px' }" 
        filterBy="label,code,route,hierarchicalPath" 
        sourceFilterPlaceholder="Buscar menú..." 
        targetFilterPlaceholder="Buscar menú...">
        
        <ng-template let-menu pTemplate="item">
            <div class="flex items-start gap-3 p-2 border-b border-gray-100 w-full">
                <i [class]="menu.icon ? menu.icon : 'pi pi-compass'" class="text-xl text-gray-500 mt-1"></i>
                <div class="flex flex-col flex-grow">
                    <span class="font-semibold text-gray-800">{{ menu.label }}</span>
                    <span class="text-sm text-gray-500 font-medium">{{ menu.hierarchicalPath }}</span>
                    <div class="flex gap-2 mt-1">
                        <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{{ menu.code }}</span>
                        <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">{{ menu.route }}</span>
                    </div>
                </div>
            </div>
        </ng-template>
        
    </p-pickList>

    <!-- Actions -->
    <div class="actions flex justify-end gap-2 mt-2">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="cancel.emit()"></button>
        <button pButton type="button" label="Guardar" icon="pi pi-check" (click)="guardar()"></button>
    </div>

</div>
