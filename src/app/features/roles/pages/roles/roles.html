<app-page-header
    title="Roles"
    subtitle="Administración y gestión de roles y permisos del sistema">
</app-page-header>

<app-page-toolbar>
    <button
        pButton
        label="Nuevo Rol"
        icon="pi pi-plus"
        (click)="showCreateDialog()">
    </button>
</app-page-toolbar>

<app-page-content>
    <div class="roles-container">
        <app-data-table
            [columns]="columns"
            [data]="roles"
            [loading]="loading"
            [rows]="10"
            [globalFilterFields]="['id', 'code', 'name', 'description', 'permissionsText']">
            
            <ng-template #actions let-row>
                <button
                    pButton
                    icon="pi pi-pencil"
                    class="p-button-text"
                    pTooltip="Editar Rol"
                    tooltipPosition="top"
                    (click)="showEditDialog(row)">
                </button>
                
                <button
                    pButton
                    icon="pi pi-trash"
                    severity="danger"
                    class="p-button-text"
                    pTooltip="Eliminar Rol"
                    tooltipPosition="top"
                    (click)="eliminarRol(row)">
                </button>
            </ng-template>
        </app-data-table>
    </div>
</app-page-content>

<app-app-dialog
    [(visible)]="dialogVisible"
    [title]="selectedRole ? 'Editar Rol' : 'Nuevo Rol'"
    width="800px">
    
    <app-role-form
        *ngIf="dialogVisible"
        [role]="selectedRole"
        (save)="guardarRol($event)"
        (cancel)="dialogVisible = false">
    </app-role-form>
</app-app-dialog>
